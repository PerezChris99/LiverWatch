{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="card auth-card">
        <h2 class="auth-heading">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your account</p>
        
        <form method="POST">
            {{ form.hidden_tag() if form.hidden_tag is defined }}
            
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" 
                       class="form-control form-control-auth">
            </div>
            
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" 
                       class="form-control form-control-auth">
            </div>
            
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember_me"> Remember me
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full-width">Sign In</button>
        </form>
        
        <p class="auth-footer-text">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
