{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="card auth-card">
        <h2 class="auth-heading">Create Account</h2>
        <p class="auth-subtitle">Join LiverWatch today</p>
        
        <form method="POST">
            {{ form.hidden_tag() if form.hidden_tag is defined }}
            
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" 
                       class="form-control form-control-auth">
            </div>
            
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" 
                       class="form-control form-control-auth">
            </div>
            
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" 
                       class="form-control form-control-auth">
            </div>
            
            <div class="form-group">
                <input type="password" name="confirm_password" placeholder="Confirm Password" 
                       class="form-control form-control-auth">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full-width">Create Account</button>
        </form>
        
        <p class="auth-footer-text">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
