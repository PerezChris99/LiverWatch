{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block meta_description %}Change your LiverWatch account password.{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 480px; margin: 0 auto;">
        <div class="card p-8">
            <h1 class="text-2xl font-bold mb-6">Change Password</h1>

            <form method="POST" action="{{ url_for('auth.change_password') }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group mb-4">
                    <label class="form-label" for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password"
                           class="form-control" placeholder="Current password" required>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label" for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password"
                           class="form-control" placeholder="New password (min 8 chars)" required>
                </div>

                <div class="form-group mb-6">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="form-control" placeholder="Repeat new password" required>
                </div>

                <div class="d-flex gap-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-lock"></i> Change Password
                    </button>
                    <a href="{{ url_for('auth.profile') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
